<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowQualify — Fill Your Calendar With Real Jobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #242220;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* ── Scattered background tokens ── */
    .fq-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .fq-token {
      position: absolute;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      user-select: none;
      animation: fqDrift var(--d) ease-in-out var(--del) infinite alternate;
    }
    @keyframes fqDrift {
      from { transform: translateY(0) rotate(var(--r)); }
      to   { transform: translateY(var(--dy)) rotate(var(--r)); }
    }

    /* ── Left: chat bubble illustration ── */
    .fq-illus-left {
      position: fixed;
      left: clamp(48px, 9vw, 130px);
      top: 50%;
      z-index: 5;
      animation: fqFloatA 5.4s ease-in-out infinite;
    }
    @keyframes fqFloatA {
      0%, 100% { transform: translateY(-50%); }
      50%       { transform: translateY(calc(-50% - 12px)); }
    }

    /* ── Right: amber cursor pointer ── */
    .fq-cursor-right {
      position: fixed;
      right: clamp(60px, 9vw, 130px);
      top: 42%;
      z-index: 5;
      animation: fqFloatB 4.8s ease-in-out 0.8s infinite;
    }
    @keyframes fqFloatB {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    /* ── Center content ── */
    .fq-center {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 32px;
    }

    .fq-h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(54px, 7.5vw, 96px);
      font-weight: 900;
      color: #f0ebe0;
      line-height: 1.04;
      letter-spacing: -0.025em;
      margin-bottom: 26px;
    }

    /* blinking text cursor */
    .fq-caret {
      display: inline-block;
      width: 4px;
      height: 0.82em;
      background: #C9A84C;
      vertical-align: middle;
      margin-left: 4px;
      border-radius: 1px;
      animation: fqBlink 1.1s step-end infinite;
    }
    @keyframes fqBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .fq-sub {
      font-size: clamp(14px, 1.75vw, 18px);
      color: rgba(240,235,224,0.46);
      line-height: 1.74;
      max-width: 500px;
      margin-bottom: 42px;
    }

    .fq-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0ebe0;
      color: #242220;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 34px;
      border-radius: 999px;
      text-decoration: none;
      border: 1.5px solid transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      letter-spacing: 0.01em;
    }
    .fq-btn:hover {
      background: transparent;
      color: #f0ebe0;
      border-color: rgba(240,235,224,0.22);
    }
  </style>
</head>
<body>

  <!-- Scattered qualification tokens in background -->
  <div class="fq-bg" id="fqBg"></div>

  <!-- Left: sketch chat bubble (Messenger AI qualification) -->
  <div class="fq-illus-left">
    <svg width="108" height="108" viewBox="0 0 108 108" fill="none"
      stroke="rgba(240,235,224,0.52)" strokeLinecap="round" strokeLinejoin="round">
      <!-- Main bubble body -->
      <rect x="6" y="8" width="82" height="54" rx="16"
        fill="rgba(255,255,255,0.04)" strokeWidth="1.8"/>
      <!-- Bubble tail pointing down-left -->
      <path d="M 18,62 L 8,86 L 42,68"
        fill="rgba(255,255,255,0.04)" strokeWidth="1.7"/>
      <!-- "text" lines inside bubble -->
      <line x1="20" y1="27" x2="70" y2="27" strokeWidth="1.4" stroke="rgba(240,235,224,0.28)"/>
      <line x1="20" y1="39" x2="58" y2="39" strokeWidth="1.4" stroke="rgba(240,235,224,0.28)"/>
      <line x1="20" y1="51" x2="66" y2="51" strokeWidth="1.4" stroke="rgba(240,235,224,0.28)"/>
    </svg>
  </div>

  <!-- Right: amber cursor pointer -->
  <div class="fq-cursor-right">
    <svg width="56" height="66" viewBox="0 0 40 48" fill="none">
      <!-- Cursor arrow shape -->
      <path d="M 4,3 L 4,39 L 13,28 L 23,45 L 29,42 L 19,25 L 34,25 Z"
        fill="#C9A84C"/>
    </svg>
  </div>

  <!-- Main headline + CTA -->
  <div class="fq-center">
    <h1 class="fq-h1">
      Fill your calendar.<span class="fq-caret"></span>
    </h1>
    <p class="fq-sub">
      FlowQualify is a done-for-you AI system that qualifies homeowners in Messenger and books real remodeling jobs directly on your calendar.
    </p>
    <a href="/opt-in" class="fq-btn">Book Your Demo →</a>
  </div>

  <script>
    // Generate scattered qualification tokens as background texture
    const bg = document.getElementById('fqBg');

    const tokens = [
      '$25k', '✓', 'scope', '$40k', 'budget', '✓', '$18k',
      'yes', 'timeline', '$32k', '✓', 'booked', '$50k',
      'qualify', '✓', '$28k', 'ready', '$60k', '?', 'scope',
      '✓', '$15k', 'budget', '$45k', 'yes', '✓', '$22k',
      'ready', 'booked', '$38k', '✓', 'timeline', '$55k',
      'qualify', '$12k', '✓', 'scope', '$70k', 'yes', '$35k',
      '✓', 'budget', '$48k', '✓', '$20k', '$42k', 'qualified',
      '?', '✓', '$65k', 'booked', 'scope', '$30k', 'yes',
    ];

    tokens.forEach(text => {
      const span = document.createElement('span');
      span.className = 'fq-token';
      span.textContent = text;

      const left = 2  + Math.random() * 96;
      const top  = 2  + Math.random() * 96;
      const size = 9  + Math.random() * 10;
      const dur  = (5 + Math.random() * 9).toFixed(1) + 's';
      // negative delay so animation is already mid-cycle on load
      const del  = '-' + (Math.random() * 8).toFixed(1) + 's';
      const dy   = '-' + (5 + Math.random() * 18).toFixed(0) + 'px';
      const r    = ((Math.random() - 0.5) * 12).toFixed(1) + 'deg';
      const op   = (0.04 + Math.random() * 0.09).toFixed(3);

      span.style.cssText = `
        left: ${left}%;
        top: ${top}%;
        font-size: ${size}px;
        --d: ${dur};
        --del: ${del};
        --dy: ${dy};
        --r: ${r};
        color: rgba(255,255,255,${op});
      `;
      bg.appendChild(span);
    });
  </script>

</body>
</html>
